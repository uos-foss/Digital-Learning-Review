{% load static %}<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Digital Learning Review{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c1e21; --muted: #5b6370;
    --line: #dfe3e8; --amber: #fff4e5; --amber-line: #e8a33d; --link: #0b5fff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.5; }
  header.site { background: var(--panel); border-bottom: 1px solid var(--line);
                padding: .75rem 1rem; display: flex; gap: 1rem; align-items: baseline; }
  header.site strong { font-size: 1rem; }
  header.site nav { margin-left: auto; font-size: .9rem; }
  main { max-width: 68rem; margin: 0 auto; padding: 1.5rem 1rem; }
  a { color: var(--link); }
  .layout { display: grid; grid-template-columns: 3fr 1fr; gap: 1.25rem; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 1rem; }
  .panel h2 { margin-top: 0; font-size: 1.05rem; }
  .actions { background: var(--amber); border: 1px solid var(--amber-line); }
  .actions ul { padding-left: 1.1rem; margin: 0; }
  .actions li { margin-bottom: .6rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
  .tabs button { font: inherit; padding: .4rem .8rem; border: 1px solid var(--line);
                 background: var(--panel); border-radius: 6px; cursor: pointer; }
  table.kv { border-collapse: collapse; width: 100%; font-size: .92rem; }
  table.kv th, table.kv td { text-align: left; padding: .35rem .5rem;
                             border-bottom: 1px solid var(--line); }
  table.kv th { color: var(--muted); font-weight: 500; width: 40%; }


  /* Report extras, kept deliberately quiet: a dot for status, small tables. */
  .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%;
         margin-right: .4rem; vertical-align: baseline; }
  .ico { display: inline-flex; vertical-align: middle; margin-right: .45rem; opacity: .8; }
  details.fold { margin: .75rem 0; }
  details.fold > summary { cursor: pointer; color: var(--muted); }
  .scroll { overflow-x: auto; }
  .gauges { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin: .5rem 0; }
  .gauge { width: 170px; text-align: center; }
  .gauge .sub { margin-top: -.3rem; font-size: .8rem; color: var(--muted); }
  .advisor-comment { border-left: 3px solid var(--line); padding-left: .9rem; margin: 1rem 0; }
  .advisor-comment p { margin: .25rem 0; }
  .tabs-links { margin: 1.5rem 0 .75rem; }
  .tabs-links a, .tabs-links strong { margin-right: 1.25rem; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="site">
  <strong>Digital Learning Review</strong>
  <span class="muted">platform spike</span>
  <nav>
    {% if user.is_authenticated %}{{ user.username }}
      &middot; <a href="/admin/">Admin</a>
    {% else %}<a href="{{ login_url|default:'/admin/login/' }}">Sign in</a>{% endif %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
