[pytest]
# The repo root is on the path so `import processing` works without installing
# the app as a package, and web/ so `accounts.rules` imports too (that module
# holds no Django, which is why it can be tested here). These tests cover the
# pure functions both the Streamlit app and the Django platform read - see
# "Django platform (web/)" in CLAUDE.md. They need no database, no Streamlit
# and no Django, so they run in either environment.
pythonpath = . web
testpaths = tests
addopts = -q
